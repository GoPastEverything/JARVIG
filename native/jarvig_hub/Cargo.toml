[package]
name = "jarvig_hub"
version = "0.0.1"
edition = "2021"
description = "JARVIG project hub. Chooses a .jarvigproject before the editor starts. It does not host a world."
license = "UNLICENSED"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "JARVIG"
path = "src/main.rs"

[dependencies]
jarvig_core = { path = "../jarvig_core" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
